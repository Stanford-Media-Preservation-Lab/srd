[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srd"
version = "1.2.0"
description = "Secure file replication with MD5 integrity verification for digital preservation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Stanford Media Preservation Lab"},
]
keywords = ["preservation", "replication", "md5", "verification", "rsync", "sftp", "archiving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]

# No third-party dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
srd = "srd.cli:main"

[project.urls]
Homepage = "https://github.com/Stanford-Media-Preservation-Lab/srd"
Repository = "https://github.com/Stanford-Media-Preservation-Lab/srd"
Issues = "https://github.com/Stanford-Media-Preservation-Lab/srd/issues"

[tool.setuptools.packages.find]
include = ["srd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
